<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubZero</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        width: 300px;
        padding: 16px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; color: #38bdf8; }
      p { margin: 0 0 16px; font-size: 14px; color: #94a3b8; }
      button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #0ea5e9, #0369a1);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <h1>🧊 SubZero</h1>
    <p>Navigate to your YouTube Subscriptions page, then click the button below.</p>
    <button id="open-subs">Go to Subscriptions</button>
    <script>
      document.getElementById('open-subs').addEventListener('click', () => {
        chrome.tabs.create({ url: 'https://www.youtube.com/feed/channels' });
        window.close();
      });
    </script>
  </body>
</html>
